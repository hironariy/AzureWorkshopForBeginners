<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" preserveAspectRatio="xMidYMid meet" role="img" data-mxgraph="editable">
  <title>今日のゴールと完成状態</title>
  <desc>受講者のブラウザーからPublic IP、NSG、Azure VM上のNGINXへHTTP通信が届く完成状態を示す。</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#0078D4"/></marker>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#1F2937" flood-opacity="0.12"/></filter>
  </defs>
  <rect width="1280" height="720" fill="#FFFFFF"/>
  <text x="640" y="72" text-anchor="middle" font-family="Segoe UI, Yu Gothic UI, Meiryo, sans-serif" font-size="30" font-weight="850" fill="#005A9E">ブラウザーから Azure VM 上の NGINX に到達する</text>
  <rect x="54" y="188" width="1172" height="350" rx="22" fill="#F7FCFF" stroke="#B7D9F5" stroke-width="2"/>
  <rect x="84" y="268" width="190" height="128" rx="8" fill="#F6F8FB" stroke="#D6DDE8" stroke-width="2" filter="url(#shadow)"/>
  <text x="179" y="318" text-anchor="middle" font-family="Segoe UI, Yu Gothic UI, Meiryo, sans-serif" font-size="24" font-weight="800" fill="#1F2937">受講者</text>
  <text x="179" y="351" text-anchor="middle" font-family="Segoe UI, Yu Gothic UI, Meiryo, sans-serif" font-size="18" font-weight="650" fill="#5F6B7A">ブラウザー</text>
  <rect x="382" y="260" width="172" height="144" rx="8" fill="#E8F3FF" stroke="#0078D4" stroke-width="2" filter="url(#shadow)"/>
  <text x="468" y="318" text-anchor="middle" font-family="Segoe UI, Yu Gothic UI, Meiryo, sans-serif" font-size="24" font-weight="800" fill="#1F2937">Public IP</text>
  <text x="468" y="351" text-anchor="middle" font-family="Segoe UI, Yu Gothic UI, Meiryo, sans-serif" font-size="17" font-weight="650" fill="#5F6B7A">公開アドレス</text>
  <rect x="625" y="260" width="190" height="144" rx="8" fill="#E9F7F5" stroke="#008575" stroke-width="2" filter="url(#shadow)"/>
  <text x="720" y="312" text-anchor="middle" font-family="Segoe UI, Yu Gothic UI, Meiryo, sans-serif" font-size="24" font-weight="800" fill="#1F2937">NSG</text>
  <text x="720" y="346" text-anchor="middle" font-family="Segoe UI, Yu Gothic UI, Meiryo, sans-serif" font-size="17" font-weight="650" fill="#5F6B7A">HTTP 80 を許可</text>
  <rect x="922" y="238" width="238" height="188" rx="8" fill="#FFF4E5" stroke="#CA5010" stroke-width="2" filter="url(#shadow)"/>
  <text x="1041" y="304" text-anchor="middle" font-family="Segoe UI, Yu Gothic UI, Meiryo, sans-serif" font-size="25" font-weight="850" fill="#1F2937">Azure VM</text>
  <text x="1041" y="340" text-anchor="middle" font-family="Segoe UI, Yu Gothic UI, Meiryo, sans-serif" font-size="20" font-weight="750" fill="#CA5010">NGINX</text>
  <text x="1041" y="372" text-anchor="middle" font-family="Segoe UI, Yu Gothic UI, Meiryo, sans-serif" font-size="17" font-weight="650" fill="#5F6B7A">Web サーバ</text>
  <line x1="274" y1="332" x2="382" y2="332" stroke="#0078D4" stroke-width="4" stroke-linecap="round" marker-end="url(#arrow)"/>
  <line x1="554" y1="332" x2="625" y2="332" stroke="#0078D4" stroke-width="4" stroke-linecap="round" marker-end="url(#arrow)"/>
  <line x1="815" y1="332" x2="922" y2="332" stroke="#0078D4" stroke-width="4" stroke-linecap="round" marker-end="url(#arrow)"/>
  <rect x="320" y="300" width="96" height="30" rx="15" fill="#FFFFFF" opacity="0.95"/>
  <text x="368" y="322" text-anchor="middle" font-family="Segoe UI, Yu Gothic UI, Meiryo, sans-serif" font-size="15" font-weight="800" fill="#0078D4">HTTP</text>
  <rect x="160" y="570" width="960" height="58" rx="20" fill="#F6F8FB" stroke="#D6DDE8" stroke-width="2"/>
  <text x="640" y="606" text-anchor="middle" font-family="Segoe UI, Yu Gothic UI, Meiryo, sans-serif" font-size="21" font-weight="780" fill="#1F2937">完成確認: NGINX の画面が表示され、最後にリソースグループを削除する</text>
</svg>
