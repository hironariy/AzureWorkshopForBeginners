<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" preserveAspectRatio="xMidYMid meet" role="img" data-mxgraph="editable">
  <title>ハンズオン進行図</title>
  <desc>リソースグループ作成からVM作成、ネットワーク確認、NGINX到達確認、リソースグループ削除までのハンズオン手順を示す。</desc>
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#0078D4"/></marker></defs>
  <rect width="1280" height="720" fill="#FFFFFF"/>
  <text x="640" y="70" text-anchor="middle" font-family="Segoe UI, Yu Gothic UI, Meiryo, sans-serif" font-size="30" font-weight="850" fill="#005A9E">作って、確認して、最後に削除する</text>
  <g font-family="Segoe UI, Yu Gothic UI, Meiryo, sans-serif">
    <rect x="70" y="220" width="175" height="170" rx="8" fill="#E8F3FF" stroke="#0078D4" stroke-width="2"/>
    <text x="157" y="274" text-anchor="middle" font-size="24" font-weight="850" fill="#1F2937">1</text><text x="157" y="318" text-anchor="middle" font-size="19" font-weight="800" fill="#1F2937">リソースグループ</text><text x="157" y="349" text-anchor="middle" font-size="15" font-weight="650" fill="#5F6B7A">まとめる外枠</text>
    <rect x="305" y="220" width="175" height="170" rx="8" fill="#FFF4E5" stroke="#CA5010" stroke-width="2"/>
    <text x="392" y="274" text-anchor="middle" font-size="24" font-weight="850" fill="#1F2937">2</text><text x="392" y="318" text-anchor="middle" font-size="19" font-weight="800" fill="#1F2937">VM 基本設定</text><text x="392" y="349" text-anchor="middle" font-size="15" font-weight="650" fill="#5F6B7A">OS / サイズ / 認証</text>
    <rect x="540" y="220" width="190" height="170" rx="8" fill="#E9F7F5" stroke="#008575" stroke-width="2"/>
    <text x="635" y="274" text-anchor="middle" font-size="24" font-weight="850" fill="#1F2937">3</text><text x="635" y="318" text-anchor="middle" font-size="19" font-weight="800" fill="#1F2937">ネットワーク</text><text x="635" y="349" text-anchor="middle" font-size="15" font-weight="650" fill="#5F6B7A">VNet / NSG / Public IP</text>
    <rect x="790" y="220" width="175" height="170" rx="8" fill="#FDF0FB" stroke="#C239B3" stroke-width="2"/>
    <text x="877" y="274" text-anchor="middle" font-size="24" font-weight="850" fill="#1F2937">4</text><text x="877" y="318" text-anchor="middle" font-size="19" font-weight="800" fill="#1F2937">NGINX</text><text x="877" y="349" text-anchor="middle" font-size="15" font-weight="650" fill="#5F6B7A">起動時スクリプト</text>
    <rect x="1025" y="220" width="185" height="170" rx="8" fill="#F6F8FB" stroke="#D6DDE8" stroke-width="2"/>
    <text x="1117" y="274" text-anchor="middle" font-size="24" font-weight="850" fill="#1F2937">5</text><text x="1117" y="318" text-anchor="middle" font-size="19" font-weight="800" fill="#1F2937">表示確認</text><text x="1117" y="349" text-anchor="middle" font-size="15" font-weight="650" fill="#5F6B7A">ブラウザーで到達</text>
    <line x1="245" y1="305" x2="305" y2="305" stroke="#0078D4" stroke-width="4" marker-end="url(#arrow)"/>
    <line x1="480" y1="305" x2="540" y2="305" stroke="#0078D4" stroke-width="4" marker-end="url(#arrow)"/>
    <line x1="730" y1="305" x2="790" y2="305" stroke="#0078D4" stroke-width="4" marker-end="url(#arrow)"/>
    <line x1="965" y1="305" x2="1025" y2="305" stroke="#0078D4" stroke-width="4" marker-end="url(#arrow)"/>
    <rect x="322" y="500" width="636" height="74" rx="24" fill="#FFF4E5" stroke="#CA5010" stroke-width="2"/>
    <text x="640" y="545" text-anchor="middle" font-size="22" font-weight="850" fill="#1F2937">最後にリソースグループを削除して課金対象を残さない</text>
  </g>
</svg>
