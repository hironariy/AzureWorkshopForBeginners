<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" preserveAspectRatio="xMidYMid meet" role="img" data-mxgraph="editable">
  <title>今日のゴールと完成状態</title>
  <desc>受講者のブラウザーからAzure Container Instances上のNGINXコンテナへHTTP通信し、ACIが講師共有Azure Container Registryからイメージを取得する関係を示す。</desc>
  <defs>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#0078D4"/></marker>
    <marker id="arrow-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#008575"/></marker>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#1F2937" flood-opacity="0.12"/></filter>
  </defs>
  <rect width="1280" height="720" fill="#FFFFFF"/>
  <text x="640" y="72" text-anchor="middle" font-family="Segoe UI, Yu Gothic UI, Meiryo, sans-serif" font-size="30" font-weight="850" fill="#005A9E">コンテナ化された NGINX を ACI で公開する</text>
  <rect x="70" y="176" width="1140" height="350" rx="22" fill="#F7FCFF" stroke="#B7D9F5" stroke-width="2"/>
  <g font-family="Segoe UI, Yu Gothic UI, Meiryo, sans-serif">
    <rect x="105" y="274" width="190" height="126" rx="8" fill="#F6F8FB" stroke="#D6DDE8" stroke-width="2" filter="url(#shadow)"/>
    <text x="200" y="320" text-anchor="middle" font-size="24" font-weight="850" fill="#1F2937">受講者</text>
    <text x="200" y="354" text-anchor="middle" font-size="18" font-weight="700" fill="#5F6B7A">ブラウザー</text>
    <rect x="508" y="240" width="270" height="190" rx="8" fill="#E9F7F5" stroke="#008575" stroke-width="2" filter="url(#shadow)"/>
    <text x="643" y="296" text-anchor="middle" font-size="25" font-weight="850" fill="#1F2937">Azure Container</text>
    <text x="643" y="329" text-anchor="middle" font-size="25" font-weight="850" fill="#1F2937">Instances</text>
    <text x="643" y="372" text-anchor="middle" font-size="21" font-weight="800" fill="#008575">NGINX コンテナ</text>
    <text x="643" y="403" text-anchor="middle" font-size="16" font-weight="650" fill="#5F6B7A">FQDN / TCP 80 で公開</text>
    <rect x="915" y="242" width="245" height="186" rx="8" fill="#E8F3FF" stroke="#0078D4" stroke-width="2" filter="url(#shadow)"/>
    <text x="1037" y="297" text-anchor="middle" font-size="24" font-weight="850" fill="#1F2937">講師共有 ACR</text>
    <text x="1037" y="337" text-anchor="middle" font-size="20" font-weight="800" fill="#0078D4">NGINX イメージ</text>
    <text x="1037" y="370" text-anchor="middle" font-size="16" font-weight="650" fill="#5F6B7A">受講者は作成しない</text>
    <line x1="295" y1="337" x2="508" y2="337" stroke="#0078D4" stroke-width="5" stroke-linecap="round" marker-end="url(#arrow-blue)"/>
    <rect x="360" y="304" width="90" height="34" rx="17" fill="#FFFFFF" stroke="#B7D9F5"/>
    <text x="405" y="328" text-anchor="middle" font-size="16" font-weight="850" fill="#0078D4">HTTP 80</text>
    <line x1="915" y1="338" x2="778" y2="338" stroke="#008575" stroke-width="5" stroke-linecap="round" marker-end="url(#arrow-teal)"/>
    <rect x="806" y="304" width="91" height="34" rx="17" fill="#FFFFFF" stroke="#8FD6CA"/>
    <text x="852" y="328" text-anchor="middle" font-size="16" font-weight="850" fill="#008575">pull</text>
    <rect x="215" y="570" width="850" height="60" rx="22" fill="#F6F8FB" stroke="#D6DDE8" stroke-width="2"/>
    <text x="640" y="607" text-anchor="middle" font-size="21" font-weight="800" fill="#1F2937">完成確認: ブラウザーで NGINX ページを表示し、最後に受講者リソースだけ削除する</text>
  </g>
</svg>
