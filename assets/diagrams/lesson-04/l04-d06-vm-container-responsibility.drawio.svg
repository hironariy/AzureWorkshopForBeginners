<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" preserveAspectRatio="xMidYMid meet" role="img" data-mxgraph="editable">
  <title>VM とコンテナの責任分界</title>
  <desc>Azure Virtual MachineではOSやミドルウェアまで利用者が管理し、Azure Container Instancesではコンテナイメージと公開設定に集中しやすくなる違いを示す。</desc>
  <defs><filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#1F2937" flood-opacity="0.12"/></filter></defs>
  <rect width="1280" height="720" fill="#FFFFFF"/>
  <text x="640" y="72" text-anchor="middle" font-family="Segoe UI, Yu Gothic UI, Meiryo, sans-serif" font-size="30" font-weight="850" fill="#005A9E">同じ Web サーバでも、利用者が管理する範囲が変わる</text>
  <g font-family="Segoe UI, Yu Gothic UI, Meiryo, sans-serif">
    <rect x="110" y="135" width="470" height="470" rx="8" fill="#FFF4E5" stroke="#CA5010" stroke-width="2" filter="url(#shadow)"/>
    <text x="345" y="185" text-anchor="middle" font-size="27" font-weight="850" fill="#1F2937">Azure VM</text>
    <text x="345" y="218" text-anchor="middle" font-size="18" font-weight="700" fill="#CA5010">OS ごと動かす</text>
    <rect x="160" y="265" width="370" height="54" rx="8" fill="#FFFFFF" stroke="#D6DDE8"/>
    <text x="345" y="299" text-anchor="middle" font-size="20" font-weight="800" fill="#1F2937">アプリケーション</text>
    <rect x="160" y="326" width="370" height="54" rx="8" fill="#FFFFFF" stroke="#D6DDE8"/>
    <text x="345" y="360" text-anchor="middle" font-size="20" font-weight="800" fill="#1F2937">NGINX / ライブラリ</text>
    <rect x="160" y="387" width="370" height="54" rx="8" fill="#FFFFFF" stroke="#D6DDE8"/>
    <text x="345" y="421" text-anchor="middle" font-size="20" font-weight="800" fill="#1F2937">ゲスト OS / パッチ</text>
    <rect x="160" y="448" width="370" height="54" rx="8" fill="#FDE7D7" stroke="#CA5010"/>
    <text x="345" y="482" text-anchor="middle" font-size="20" font-weight="800" fill="#1F2937">VM サイズ / Disk / NIC</text>
    <text x="345" y="545" text-anchor="middle" font-size="18" font-weight="700" fill="#5F6B7A">自由度は高いが、管理対象も広い</text>
    <rect x="700" y="135" width="470" height="470" rx="8" fill="#E9F7F5" stroke="#008575" stroke-width="2" filter="url(#shadow)"/>
    <text x="935" y="185" text-anchor="middle" font-size="27" font-weight="850" fill="#1F2937">Azure Container Instances</text>
    <text x="935" y="218" text-anchor="middle" font-size="18" font-weight="700" fill="#008575">コンテナを直接動かす</text>
    <rect x="750" y="286" width="370" height="64" rx="8" fill="#FFFFFF" stroke="#D6DDE8"/>
    <text x="935" y="325" text-anchor="middle" font-size="21" font-weight="850" fill="#1F2937">コンテナイメージ</text>
    <rect x="750" y="365" width="370" height="64" rx="8" fill="#DFF4F0" stroke="#008575"/>
    <text x="935" y="404" text-anchor="middle" font-size="21" font-weight="850" fill="#1F2937">CPU / メモリ / 公開ポート</text>
    <rect x="750" y="444" width="370" height="64" rx="8" fill="#F6F8FB" stroke="#D6DDE8" stroke-dasharray="8 6"/>
    <text x="935" y="483" text-anchor="middle" font-size="20" font-weight="800" fill="#5F6B7A">ホスト OS は利用者から隠れる</text>
    <text x="935" y="545" text-anchor="middle" font-size="18" font-weight="700" fill="#5F6B7A">OS 管理を減らし、イメージと実行設定に集中</text>
  </g>
</svg>
