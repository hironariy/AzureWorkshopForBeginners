<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" preserveAspectRatio="xMidYMid meet" role="img" data-mxgraph="editable">
  <title>レジストリ、コントロールプレーン、データプレーン</title>
  <desc>Azureのコンテナ利用を、イメージを保管するレジストリ、作成や管理を受け付けるコントロールプレーン、実際にコンテナが動くデータプレーンに分けて整理する。</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#0078D4"/></marker>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#1F2937" flood-opacity="0.12"/></filter>
  </defs>
  <rect width="1280" height="720" fill="#FFFFFF"/>
  <text x="640" y="72" text-anchor="middle" font-family="Segoe UI, Yu Gothic UI, Meiryo, sans-serif" font-size="30" font-weight="850" fill="#005A9E">コンテナ環境は 3 つの面で見ると整理しやすい</text>
  <g font-family="Segoe UI, Yu Gothic UI, Meiryo, sans-serif">
    <rect x="70" y="150" width="330" height="405" rx="8" fill="#E8F3FF" stroke="#0078D4" stroke-width="2" filter="url(#shadow)"/>
    <text x="235" y="202" text-anchor="middle" font-size="25" font-weight="850" fill="#1F2937">レジストリ</text>
    <text x="235" y="242" text-anchor="middle" font-size="18" font-weight="700" fill="#005A9E">イメージを保管</text>
    <rect x="120" y="300" width="230" height="110" rx="8" fill="#FFFFFF" stroke="#B7D9F5"/>
    <text x="235" y="342" text-anchor="middle" font-size="22" font-weight="850" fill="#1F2937">Azure Container</text>
    <text x="235" y="372" text-anchor="middle" font-size="22" font-weight="850" fill="#1F2937">Registry</text>
    <text x="235" y="478" text-anchor="middle" font-size="18" font-weight="700" fill="#5F6B7A">push / pull の置き場所</text>
    <rect x="475" y="150" width="330" height="405" rx="8" fill="#FDF0FB" stroke="#C239B3" stroke-width="2" filter="url(#shadow)"/>
    <text x="640" y="202" text-anchor="middle" font-size="25" font-weight="850" fill="#1F2937">コントロールプレーン</text>
    <text x="640" y="242" text-anchor="middle" font-size="18" font-weight="700" fill="#9B1B8B">作成と管理の入口</text>
    <rect x="525" y="295" width="230" height="58" rx="8" fill="#FFFFFF" stroke="#E5B6DF"/>
    <text x="640" y="331" text-anchor="middle" font-size="20" font-weight="850" fill="#1F2937">ACI / ACA / AKS</text>
    <rect x="525" y="370" width="230" height="58" rx="8" fill="#FFFFFF" stroke="#E5B6DF"/>
    <text x="640" y="406" text-anchor="middle" font-size="20" font-weight="850" fill="#1F2937">Portal / API</text>
    <text x="640" y="478" text-anchor="middle" font-size="18" font-weight="700" fill="#5F6B7A">実行したい状態を受け付ける</text>
    <rect x="880" y="150" width="330" height="405" rx="8" fill="#E9F7F5" stroke="#008575" stroke-width="2" filter="url(#shadow)"/>
    <text x="1045" y="202" text-anchor="middle" font-size="25" font-weight="850" fill="#1F2937">データプレーン</text>
    <text x="1045" y="242" text-anchor="middle" font-size="18" font-weight="700" fill="#008575">コンテナが動く場所</text>
    <rect x="930" y="285" width="230" height="70" rx="8" fill="#FFFFFF" stroke="#8FD6CA"/>
    <text x="1045" y="327" text-anchor="middle" font-size="21" font-weight="850" fill="#1F2937">今回: ACI</text>
    <rect x="930" y="372" width="230" height="70" rx="8" fill="#FFFFFF" stroke="#8FD6CA"/>
    <text x="1045" y="414" text-anchor="middle" font-size="21" font-weight="850" fill="#1F2937">次回以降: ACA</text>
    <text x="1045" y="478" text-anchor="middle" font-size="18" font-weight="700" fill="#5F6B7A">実行基盤の見え方が変わる</text>
    <line x1="400" y1="355" x2="475" y2="355" stroke="#0078D4" stroke-width="4" marker-end="url(#arrow)"/>
    <line x1="805" y1="355" x2="880" y2="355" stroke="#0078D4" stroke-width="4" marker-end="url(#arrow)"/>
  </g>
</svg>
