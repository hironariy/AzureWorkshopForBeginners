<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" preserveAspectRatio="xMidYMid meet" role="img" data-mxgraph="editable">
  <title>ハンズオン進行図</title>
  <desc>リソースグループ作成、Azure Container Instances作成、共有Azure Container Registryのイメージ指定、公開設定、Running確認、ブラウザー確認、削除までの流れを示す。</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#0078D4"/></marker>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#1F2937" flood-opacity="0.12"/></filter>
  </defs>
  <rect width="1280" height="720" fill="#FFFFFF"/>
  <text x="640" y="72" text-anchor="middle" font-family="Segoe UI, Yu Gothic UI, Meiryo, sans-serif" font-size="30" font-weight="850" fill="#005A9E">作成、公開、確認、削除の順に進める</text>
  <g font-family="Segoe UI, Yu Gothic UI, Meiryo, sans-serif">
    <rect x="65" y="220" width="150" height="126" rx="8" fill="#F6F8FB" stroke="#D6DDE8" stroke-width="2" filter="url(#shadow)"/>
    <text x="140" y="262" text-anchor="middle" font-size="18" font-weight="850" fill="#0078D4">1</text>
    <text x="140" y="292" text-anchor="middle" font-size="18" font-weight="850" fill="#1F2937">RG</text>
    <text x="140" y="320" text-anchor="middle" font-size="15" font-weight="650" fill="#5F6B7A">作成</text>
    <rect x="240" y="220" width="150" height="126" rx="8" fill="#E9F7F5" stroke="#008575" stroke-width="2" filter="url(#shadow)"/>
    <text x="315" y="262" text-anchor="middle" font-size="18" font-weight="850" fill="#0078D4">2</text>
    <text x="315" y="292" text-anchor="middle" font-size="18" font-weight="850" fill="#1F2937">ACI</text>
    <text x="315" y="320" text-anchor="middle" font-size="15" font-weight="650" fill="#5F6B7A">作成開始</text>
    <rect x="415" y="220" width="150" height="126" rx="8" fill="#E8F3FF" stroke="#0078D4" stroke-width="2" filter="url(#shadow)"/>
    <text x="490" y="262" text-anchor="middle" font-size="18" font-weight="850" fill="#0078D4">3</text>
    <text x="490" y="292" text-anchor="middle" font-size="18" font-weight="850" fill="#1F2937">ACR</text>
    <text x="490" y="320" text-anchor="middle" font-size="15" font-weight="650" fill="#5F6B7A">イメージ指定</text>
    <rect x="590" y="220" width="150" height="126" rx="8" fill="#FFF4E5" stroke="#CA5010" stroke-width="2" filter="url(#shadow)"/>
    <text x="665" y="262" text-anchor="middle" font-size="18" font-weight="850" fill="#0078D4">4</text>
    <text x="665" y="292" text-anchor="middle" font-size="18" font-weight="850" fill="#1F2937">Public</text>
    <text x="665" y="320" text-anchor="middle" font-size="15" font-weight="650" fill="#5F6B7A">HTTP 80</text>
    <rect x="765" y="220" width="150" height="126" rx="8" fill="#E9F7F5" stroke="#008575" stroke-width="2" filter="url(#shadow)"/>
    <text x="840" y="262" text-anchor="middle" font-size="18" font-weight="850" fill="#0078D4">5</text>
    <text x="840" y="292" text-anchor="middle" font-size="18" font-weight="850" fill="#1F2937">Running</text>
    <text x="840" y="320" text-anchor="middle" font-size="15" font-weight="650" fill="#5F6B7A">状態確認</text>
    <rect x="940" y="220" width="150" height="126" rx="8" fill="#FDF0FB" stroke="#C239B3" stroke-width="2" filter="url(#shadow)"/>
    <text x="1015" y="262" text-anchor="middle" font-size="18" font-weight="850" fill="#0078D4">6</text>
    <text x="1015" y="292" text-anchor="middle" font-size="18" font-weight="850" fill="#1F2937">NGINX</text>
    <text x="1015" y="320" text-anchor="middle" font-size="15" font-weight="650" fill="#5F6B7A">表示確認</text>
    <rect x="1115" y="220" width="120" height="126" rx="8" fill="#F6F8FB" stroke="#D6DDE8" stroke-width="2" filter="url(#shadow)"/>
    <text x="1175" y="262" text-anchor="middle" font-size="18" font-weight="850" fill="#0078D4">7</text>
    <text x="1175" y="292" text-anchor="middle" font-size="18" font-weight="850" fill="#1F2937">削除</text>
    <text x="1175" y="320" text-anchor="middle" font-size="15" font-weight="650" fill="#5F6B7A">RG</text>
    <line x1="215" y1="283" x2="240" y2="283" stroke="#0078D4" stroke-width="4" marker-end="url(#arrow)"/>
    <line x1="390" y1="283" x2="415" y2="283" stroke="#0078D4" stroke-width="4" marker-end="url(#arrow)"/>
    <line x1="565" y1="283" x2="590" y2="283" stroke="#0078D4" stroke-width="4" marker-end="url(#arrow)"/>
    <line x1="740" y1="283" x2="765" y2="283" stroke="#0078D4" stroke-width="4" marker-end="url(#arrow)"/>
    <line x1="915" y1="283" x2="940" y2="283" stroke="#0078D4" stroke-width="4" marker-end="url(#arrow)"/>
    <line x1="1090" y1="283" x2="1115" y2="283" stroke="#0078D4" stroke-width="4" marker-end="url(#arrow)"/>
    <rect x="212" y="500" width="856" height="62" rx="22" fill="#F6F8FB" stroke="#D6DDE8" stroke-width="2"/>
    <text x="640" y="538" text-anchor="middle" font-size="21" font-weight="800" fill="#1F2937">各手順で、アーキテクチャ上のどこを作っているかを確認する</text>
  </g>
