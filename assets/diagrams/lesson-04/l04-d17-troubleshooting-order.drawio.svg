<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" preserveAspectRatio="xMidYMid meet" role="img" data-mxgraph="editable">
  <title>表示されないときの確認順</title>
  <desc>Azure Container Instances上のNGINXが表示されない場合に、Running状態、宛先、HTTP、TCP 80、イメージ名とタグ、ACRからのpull、講師デモへの切り替えを順番に確認する流れを示す。</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#0078D4"/></marker>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#1F2937" flood-opacity="0.12"/></filter>
  </defs>
  <rect width="1280" height="720" fill="#FFFFFF"/>
  <text x="640" y="72" text-anchor="middle" font-family="Segoe UI, Yu Gothic UI, Meiryo, sans-serif" font-size="30" font-weight="850" fill="#005A9E">表示されないときは、手前から順に確認する</text>
  <g font-family="Segoe UI, Yu Gothic UI, Meiryo, sans-serif">
    <rect x="90" y="150" width="300" height="430" rx="8" fill="#E9F7F5" stroke="#008575" stroke-width="2" filter="url(#shadow)"/>
    <text x="240" y="200" text-anchor="middle" font-size="25" font-weight="850" fill="#1F2937">ACI 側</text>
    <rect x="125" y="245" width="230" height="54" rx="8" fill="#FFFFFF" stroke="#8FD6CA"/>
    <text x="240" y="280" text-anchor="middle" font-size="18" font-weight="850" fill="#1F2937">1. Running か</text>
    <rect x="125" y="315" width="230" height="54" rx="8" fill="#FFFFFF" stroke="#8FD6CA"/>
    <text x="240" y="350" text-anchor="middle" font-size="18" font-weight="850" fill="#1F2937">2. FQDN か</text>
    <rect x="125" y="385" width="230" height="54" rx="8" fill="#FFFFFF" stroke="#8FD6CA"/>
    <text x="240" y="420" text-anchor="middle" font-size="18" font-weight="850" fill="#1F2937">3. HTTP か</text>
    <rect x="125" y="455" width="230" height="54" rx="8" fill="#FFFFFF" stroke="#8FD6CA"/>
    <text x="240" y="490" text-anchor="middle" font-size="18" font-weight="850" fill="#1F2937">4. TCP 80 か</text>
    <rect x="490" y="220" width="300" height="220" rx="8" fill="#E8F3FF" stroke="#0078D4" stroke-width="2" filter="url(#shadow)"/>
    <text x="640" y="270" text-anchor="middle" font-size="25" font-weight="850" fill="#1F2937">ACR / イメージ側</text>
    <rect x="525" y="320" width="230" height="54" rx="8" fill="#FFFFFF" stroke="#B7D9F5"/>
    <text x="640" y="355" text-anchor="middle" font-size="18" font-weight="850" fill="#1F2937">5. イメージ名とタグ</text>
    <rect x="525" y="390" width="230" height="54" rx="8" fill="#FFFFFF" stroke="#B7D9F5"/>
    <text x="640" y="425" text-anchor="middle" font-size="18" font-weight="850" fill="#1F2937">6. pull 権限</text>
    <rect x="890" y="250" width="300" height="160" rx="8" fill="#FFF4E5" stroke="#CA5010" stroke-width="2" filter="url(#shadow)"/>
    <text x="1040" y="305" text-anchor="middle" font-size="25" font-weight="850" fill="#1F2937">時間内に戻れない</text>
    <text x="1040" y="350" text-anchor="middle" font-size="20" font-weight="800" fill="#CA5010">7. 講師デモへ切替</text>
    <line x1="390" y1="365" x2="490" y2="365" stroke="#0078D4" stroke-width="4" marker-end="url(#arrow)"/>
    <line x1="790" y1="365" x2="890" y2="365" stroke="#0078D4" stroke-width="4" marker-end="url(#arrow)"/>
    <rect x="233" y="620" width="814" height="52" rx="20" fill="#F6F8FB" stroke="#D6DDE8" stroke-width="2"/>
    <text x="640" y="653" text-anchor="middle" font-size="20" font-weight="800" fill="#1F2937">直せない場合も、作成途中リソースの削除確認は最後に行う</text>
  </g>
</svg>
