<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" preserveAspectRatio="xMidYMid meet" role="img" content="&lt;mxfile host=&quot;app.diagrams.net&quot; agent=&quot;GitHub Copilot&quot; version=&quot;24.7.17&quot;&gt;&lt;diagram id=&quot;l06-d10-cleanup-targets&quot; name=&quot;クリーンアップ対象の判断図&quot;&gt;&lt;mxGraphModel&gt;&lt;root&gt;&lt;mxCell value=&quot;Azure Database for PostgreSQL&quot; style=&quot;shape=image;html=1;aspect=fixed;image=img/lib/azure2/databases/Azure_Database_PostgreSQL_Server.svg&quot;/&gt;&lt;mxCell value=&quot;Resource Group&quot; style=&quot;shape=image;html=1;aspect=fixed;image=img/lib/azure2/general/Resourcegroups.svg&quot;/&gt;&lt;mxCell value=&quot;App registration&quot; style=&quot;shape=image;html=1;aspect=fixed;image=img/lib/azure2/identity/App_Registrations.svg&quot;/&gt;&lt;/root&gt;&lt;/mxGraphModel&gt;&lt;/diagram&gt;&lt;/mxfile&gt;" data-mxgraph="editable">
  <title>クリーンアップ対象の判断図</title>
  <desc>復習のためリソースを残す場合と、不要な場合に削除する対象を整理し、Resource group 削除だけでは GitHub Secret や Entra ID 側の登録が残ることを示す。</desc>
  <defs><style><![CDATA[text{font-family:'Segoe UI','Yu Gothic UI',Meiryo,sans-serif}.title{font-size:28px;font-weight:800;fill:#005A9E}.head{font-size:23px;font-weight:850;fill:#1F2937}.label{font-size:20px;font-weight:800;fill:#1F2937}.small{font-size:16px;font-weight:650;fill:#5F6B7A}.box{fill:#fff;stroke:#D6DDE8;stroke-width:2}]]></style></defs>
  <rect width="1280" height="720" fill="#FFFFFF"/><text x="640" y="64" text-anchor="middle" class="title">終わり方は「残す」「停止する」「削除する」を分けて判断する</text>
  <rect x="80" y="135" width="515" height="420" rx="14" fill="#EDF7ED" stroke="#498205" stroke-width="2"/><text x="125" y="180" class="head">復習のため残す場合</text>
  <rect x="685" y="135" width="515" height="420" rx="14" fill="#FFF4E5" stroke="#CA5010" stroke-width="2"/><text x="730" y="180" class="head">不要なら削除する場合</text>
  <rect x="150" y="260" width="190" height="95" rx="8" class="box"/><text x="245" y="298" text-anchor="middle" class="label">PostgreSQL</text><text x="245" y="326" text-anchor="middle" class="small">Stop で抑制</text>
  <rect x="355" y="270" width="190" height="80" rx="8" class="box"/><text x="450" y="302" text-anchor="middle" class="label">GitHub Secret</text><text x="450" y="329" text-anchor="middle" class="small">必要性を確認</text>
  <rect x="750" y="255" width="190" height="100" rx="8" class="box"/><text x="845" y="295" text-anchor="middle" class="label">Resource Group</text><text x="845" y="323" text-anchor="middle" class="small">Azure リソース削除</text>
  <rect x="970" y="255" width="190" height="100" rx="8" class="box"/><text x="1065" y="295" text-anchor="middle" class="label">Entra ID</text><text x="1065" y="323" text-anchor="middle" class="small">App / SP 削除</text>
  <rect x="365" y="590" width="550" height="70" rx="8" fill="#F6F8FB" stroke="#D6DDE8" stroke-width="2"/><text x="640" y="620" text-anchor="middle" class="label">Resource group 削除だけでは</text><text x="640" y="646" text-anchor="middle" class="small">GitHub Secret や Entra ID 側の登録は自動では消えない</text>
</svg>